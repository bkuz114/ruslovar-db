# MySQL connection settings for manager.py
#
# manager.py requires this file to connect to MySQL.
# It searches these locations in order and uses the first one found:
#   1. ./.mysql-import.conf   (the directory you run manager.py from)
#   2. ~/.mysql-import.conf (your home directory)
#   3. /etc/.mysql-import.conf
#
# Or specify an explicit path with --config.

[mysql]

# Hostname or IP address of the MySQL server
host = localhost

# Port the MySQL server is listening on
# (3306 is the default MySQL port)
port = 3306

# Username for authenticating to the MySQL server itself
# (this is the MySQL user account, not an application-level user)
user = root

# Password for the MySQL user account above
password = password

# Database to connect to on the MySQL server
database = runouns

# Database table
table = nouns_morf

# Character set for the connection
# IMPORTANT: Do not change this. The database stores Cyrillic text
# and requires UTF-8 compatibility. utf8mb4 is the correct setting.
charset = utf8mb4
